<!--
  Bright Skies Services | Funnel step 3 of 3: Thank-you page
  Paste all of this into ONE "Custom JS/HTML" element, inside a full-width section with 0 padding.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@keyframes bss-drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(70px,40px,0) scale(1.15)}}
@keyframes bss-up{from{opacity:0;translate:0 22px}to{opacity:1;translate:none}}
@keyframes bss-draw{to{transform:scaleX(1)}}
@keyframes bss-pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes bss-tick{to{stroke-dashoffset:0}}
@keyframes bss-pulse{0%{transform:scale(.8);opacity:.7}100%{transform:scale(1.7);opacity:0}}
#bss{--bss-indigo:#333394;--bss-indigo-deep:#26266f;--bss-navy:#151549;--bss-gold:#e8b528;--bss-gold-light:#f5c542;--bss-ink:#24243d;--bss-muted:#5d5d72;--bss-line:#e6e6f0;--bss-ease:cubic-bezier(.2,.7,.2,1);position:relative;isolation:isolate;width:100%;min-height:100vh;margin:0;padding:0 0 1px;overflow:hidden;background:linear-gradient(180deg,#fff 0%,#f4f4fb 50%,#fff 100%);color:var(--bss-ink);font-family:"Roboto",Arial,sans-serif;font-size:16px;font-weight:400;line-height:1.6;letter-spacing:normal;text-align:left;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#bss *,#bss *::before,#bss *::after{box-sizing:border-box}
#bss h1,#bss p{margin:0;padding:0}
#bss h1{font-family:"Raleway",Arial,sans-serif;line-height:1.12;text-transform:none;text-wrap:balance}
#bss img,#bss svg{display:block;max-width:100%;height:auto;border:0}
#bss a:focus-visible{outline:3px solid rgba(232,181,40,.85);outline-offset:3px}
#bss .bss-bg{position:absolute;z-index:-1;inset:0;overflow:hidden;pointer-events:none}
#bss .bss-bg span{position:absolute;display:block;border-radius:50%;animation:bss-drift 18s ease-in-out infinite alternate}
#bss .bss-bg span:nth-child(1){top:60px;left:50%;width:960px;height:560px;margin-left:-480px;background:radial-gradient(closest-side,rgba(85,85,204,.16),rgba(85,85,204,0))}
#bss .bss-bg span:nth-child(2){top:280px;right:-260px;width:560px;height:560px;background:radial-gradient(closest-side,rgba(232,181,40,.18),rgba(232,181,40,0));animation-duration:22s;animation-direction:alternate-reverse}
#bss .bss-header{display:flex;min-height:76px;justify-content:center;align-items:center;padding:15px 24px 8px}
#bss .bss-header img{width:148px}
#bss .bss-thanks{position:relative;isolation:isolate;overflow:hidden;width:min(100% - 48px,760px);margin:40px auto 100px;padding:60px 48px 52px;border:1px solid rgba(51,51,148,.12);border-radius:28px;background:linear-gradient(145deg,#f4f4fb 0%,#fff 50%,#fff9e9 100%);box-shadow:0 30px 70px rgba(37,37,89,.1);text-align:center;animation:bss-up .9s var(--bss-ease) both}
#bss .bss-thanks::before{content:"";position:absolute;top:0;right:36px;left:36px;height:3px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,var(--bss-indigo),var(--bss-gold))}
#bss .bss-check{position:relative;width:84px;height:84px;margin:0 auto 26px;border-radius:50%;background:linear-gradient(135deg,var(--bss-gold-light),var(--bss-gold));box-shadow:0 14px 34px rgba(232,181,40,.35);animation:bss-pop .7s var(--bss-ease) .25s both}
#bss .bss-check::after{content:"";position:absolute;inset:0;border:2px solid var(--bss-gold);border-radius:50%;opacity:0;animation:bss-pulse 2.4s ease-out 1s infinite}
#bss .bss-check svg{position:absolute;top:50%;left:50%;width:42px;height:42px;margin:-21px 0 0 -21px}
#bss .bss-check path{fill:none;stroke:var(--bss-navy);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;animation:bss-tick .6s var(--bss-ease) .8s forwards}
#bss .bss-thanks > :not(.bss-check){animation:bss-up .9s var(--bss-ease) both}
#bss .bss-thanks > :nth-child(2){animation-delay:.27s}
#bss .bss-thanks > :nth-child(3){animation-delay:.35s}
#bss .bss-thanks > :nth-child(4){animation-delay:.43s}
#bss .bss-thanks > :nth-child(5){animation-delay:.51s}
#bss .bss-thanks > :nth-child(6){animation-delay:.59s}
#bss .bss-eyebrow{display:block;margin:0 0 14px;color:var(--bss-indigo);font-size:12px;font-weight:700;letter-spacing:.14em;line-height:1.4;text-transform:uppercase}
#bss .bss-thanks h1{position:relative;isolation:isolate;margin:0 auto 18px;color:var(--bss-indigo-deep);font-size:clamp(2.1rem,4.4vw,3.4rem);font-weight:800;letter-spacing:-.04em}
#bss .bss-hl{position:relative;color:var(--bss-indigo);white-space:nowrap}
#bss .bss-hl::after{content:"";position:absolute;z-index:-1;right:-.04em;bottom:.04em;left:-.04em;height:.2em;border-radius:999px;background:linear-gradient(90deg,var(--bss-gold),var(--bss-gold-light));opacity:.85;transform:scaleX(0);transform-origin:left;animation:bss-draw 1s var(--bss-ease) 1s forwards}
#bss .bss-lead{max-width:560px;margin:0 auto 14px;color:var(--bss-muted);font-size:17px}
#bss .bss-help{margin-top:30px;padding-top:26px;border-top:1px solid var(--bss-line)}
#bss .bss-help p{margin:0 0 14px;color:var(--bss-muted);font-size:15px}
#bss .bss-btn{position:relative;isolation:isolate;display:inline-flex;min-height:52px;justify-content:center;align-items:center;gap:10px;overflow:hidden;padding:13px 26px;border:1px solid var(--bss-indigo);border-radius:999px;background-color:var(--bss-indigo);background-image:linear-gradient(135deg,var(--bss-indigo) 0%,var(--bss-indigo-deep) 100%);box-shadow:0 10px 26px rgba(51,51,148,.28);color:#fff;font-size:15px;font-weight:700;letter-spacing:.03em;line-height:1.2;text-decoration:none;transition:transform .25s var(--bss-ease),box-shadow .3s ease}
#bss .bss-btn::before{content:"";position:absolute;z-index:-1;top:0;left:-70%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.32),transparent);transform:skewX(-20deg);transition:left .7s var(--bss-ease)}
#bss .bss-btn:hover{box-shadow:0 16px 36px rgba(51,51,148,.36),0 0 0 4px rgba(232,181,40,.28);transform:translateY(-2px)}
#bss .bss-btn:hover::before{left:130%}
#bss .bss-btn svg{width:18px;height:18px;flex:0 0 18px}
@media (max-width:640px){
  #bss .bss-header{min-height:65px;padding:12px 16px 4px}
  #bss .bss-header img{width:132px}
  #bss .bss-bg span:nth-child(1){width:560px;height:440px;margin-left:-280px}
  #bss .bss-bg span:nth-child(2){top:300px;right:-200px;width:380px;height:380px}
  #bss .bss-thanks{width:calc(100% - 32px);margin:24px auto 56px;padding:44px 22px 36px;border-radius:20px}
  #bss .bss-check{width:72px;height:72px;margin-bottom:22px}
  #bss .bss-eyebrow{font-size:10px;letter-spacing:.1em}
  #bss .bss-thanks h1{font-size:clamp(1.9rem,8.4vw,2.6rem)}
  #bss .bss-lead{font-size:15px}
}
@media (prefers-reduced-motion:reduce){
  #bss *,#bss *::before,#bss *::after{animation:none !important;transition-duration:.01ms !important}
  #bss .bss-check path{stroke-dashoffset:0}
  #bss .bss-hl::after{transform:none}
}
</style>

<div id="bss">
  <div class="bss-bg" aria-hidden="true"><span></span><span></span></div>
  <header class="bss-header">
    <img src="https://img1.wsimg.com/isteam/ip/ede29c46-864b-4bea-afe1-1c4cf4c2ccdf/logo/f2dc896d-bda5-4912-80f0-ba4c31a88c16.jpg/:/rs=w:285,h:86,cg:true,m/cr=w:285,h:86/qt=q:100/ll" alt="BrightSkies Services" width="285" height="86">
  </header>
  <main class="bss-thanks">
    <div class="bss-check" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M5 12.5 10 17 19 7.5"/></svg></div>
    <p class="bss-eyebrow">Bright Skies Services</p>
    <h1>Thanks for <span class="bss-hl">Booking</span> Your Call!</h1>
    <p class="bss-lead">Your complimentary Financial Wellness Consultation is on the calendar. Check your email for your confirmation and meeting details.</p>
    <p class="bss-lead">We look forward to speaking with you.</p>
    <div class="bss-help">
      <p>Questions before your call?</p>
      <a class="bss-btn" href="tel:+16153105778"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>(615) 310-5778</a>
    </div>
  </main>
</div>
