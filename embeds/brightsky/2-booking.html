<!--
  BrightSkies Services | Funnel step 2 of 3: Booking page
  Paste all of this into ONE "Custom JS/HTML" element, inside a full-width section with 0 padding.
  Your Calendly calendar is already in place (look for "YOUR CALENDAR GOES HERE" to change it).
  On phones the whole page fits one screen: the calendar fills the space below the title.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://calendly.com">
<link rel="preconnect" href="https://assets.calendly.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* The calendar sits straight on a white background with no extra frame around it, so Calendly's
   own card is the only box. No rule here reaches inside .bss-slot, and #bss sets no fonts or colors. */
@keyframes bss-drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(70px,40px,0) scale(1.15)}}
@keyframes bss-up{from{opacity:0;translate:0 22px}to{opacity:1;translate:none}}
@keyframes bss-draw{to{transform:scaleX(1)}}
@keyframes bss-spin{to{transform:rotate(360deg)}}
#bss{position:relative;width:100%;min-height:100vh;margin:0;padding:0;background:#fff}
#bss .bss-top{position:relative;overflow:hidden;background:linear-gradient(180deg,#fff 0%,#f4f4fb 55%,#fff 100%)}
#bss .bss-bg{position:absolute;inset:0;pointer-events:none}
#bss .bss-bg span{position:absolute;display:block;border-radius:50%;animation:bss-drift 18s ease-in-out infinite alternate}
#bss .bss-bg span:nth-child(1){top:4%;left:50%;width:960px;height:80%;margin-left:-480px;background:radial-gradient(closest-side,rgba(85,85,204,.16),rgba(85,85,204,0))}
#bss .bss-bg span:nth-child(2){top:10%;right:-200px;width:460px;height:70%;background:radial-gradient(closest-side,rgba(232,181,40,.16),rgba(232,181,40,0));animation-duration:22s;animation-direction:alternate-reverse}
#bss .bss-header{position:relative;box-sizing:border-box;display:flex;min-height:76px;justify-content:center;align-items:center;padding:15px 24px 8px}
#bss .bss-header img{display:block;width:148px;max-width:100%;height:auto;border:0}
#bss .bss-intro{position:relative;box-sizing:border-box;width:min(100%,1000px);margin:0 auto;padding:30px 24px 40px;color:#24243d;font-family:"Roboto",Arial,sans-serif;font-size:16px;font-weight:400;line-height:1.6;letter-spacing:normal;text-align:center;-webkit-font-smoothing:antialiased}
#bss .bss-intro > *{animation:bss-up .9s cubic-bezier(.2,.7,.2,1) both}
#bss .bss-intro > :nth-child(2){animation-delay:.08s}
#bss .bss-intro > :nth-child(3){animation-delay:.16s}
#bss .bss-intro > :nth-child(4){animation-delay:.24s}
#bss .bss-eyebrow{display:block;margin:0 0 14px;padding:0;color:#333394;font-size:12px;font-weight:700;letter-spacing:.14em;line-height:1.4;text-transform:uppercase}
#bss .bss-intro h1{position:relative;isolation:isolate;max-width:860px;margin:0 auto 16px;padding:0;color:#26266f;font-family:"Raleway",Arial,sans-serif;font-size:clamp(2.1rem,4.4vw,3.6rem);font-weight:800;letter-spacing:-.04em;line-height:1.12;text-transform:none;text-wrap:balance}
#bss .bss-hl{position:relative;color:#333394;white-space:nowrap}
#bss .bss-hl::after{content:"";position:absolute;z-index:-1;right:-.04em;bottom:.04em;left:-.04em;height:.2em;border-radius:999px;background:linear-gradient(90deg,#e8b528,#f5c542);opacity:.85;transform:scaleX(0);transform-origin:left;animation:bss-draw 1s cubic-bezier(.2,.7,.2,1) .7s forwards}
#bss .bss-sub{max-width:620px;margin:0 auto;padding:0;color:#4f4f66;font-size:clamp(1rem,1.5vw,1.15rem)}
#bss .bss-trust{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 28px;margin:24px auto 0;padding:0;color:#4f4f66;font-size:14px;font-weight:500;line-height:1.3;list-style:none}
#bss .bss-trust li{display:inline-flex;align-items:center;gap:8px;margin:0;padding:0}
#bss .bss-trust svg{display:block}
#bss .bss-trust__g{display:inline-flex;width:24px;height:24px;justify-content:center;align-items:center;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(37,37,89,.12)}
#bss .bss-trust__g svg{width:14px;height:14px}
#bss .bss-trust__stars{color:#e8b528;font-size:14px;letter-spacing:.08em}
#bss .bss-trust__check{display:inline-flex;width:22px;height:22px;justify-content:center;align-items:center;border-radius:50%;background:rgba(51,51,148,.1);color:#333394}
#bss .bss-trust__check svg{width:13px;height:13px}
#bss .bss-cal{position:relative;box-sizing:border-box;width:min(100%,1100px);margin:0 auto;padding:0 20px 64px;animation:bss-up .9s cubic-bezier(.2,.7,.2,1) .3s both}
#bss .bss-loader{position:absolute;top:110px;right:0;left:0;display:flex;flex-direction:column;align-items:center;gap:14px;margin:0;color:#5d5d72;font-family:"Roboto",Arial,sans-serif;font-size:14px;font-weight:500;text-align:center;transition:opacity .4s ease,visibility 0s .4s}
#bss .bss-loader::before{content:"";width:34px;height:34px;border:3px solid rgba(51,51,148,.15);border-top-color:#333394;border-right-color:#e8b528;border-radius:50%;animation:bss-spin .9s linear infinite}
#bss .bss-loader.is-done{opacity:0;visibility:hidden}
#bss .bss-slot{position:relative;box-sizing:border-box;width:100%}
#bss .bss-slot:not(:has(*)){min-height:160px;border:2px dashed #d9d9e8;border-radius:20px}
#bss .bss-slot:not(:has(*))::after{content:"Your calendar will show here once you add it.";display:flex;min-height:156px;justify-content:center;align-items:center;color:#8a8a9c;font-family:"Roboto",Arial,sans-serif;font-size:14px;text-align:center}
@media (max-width:640px){
  /* Phones: compact top so the header, title and calendar all fit on one screen */
  #bss{min-height:0}
  #bss .bss-header{min-height:50px;padding:10px 16px 0}
  #bss .bss-header img{width:110px}
  #bss .bss-bg span:nth-child(1){width:560px;margin-left:-280px}
  #bss .bss-bg span:nth-child(2){right:-180px;width:320px}
  #bss .bss-intro{padding:8px 16px 14px}
  #bss .bss-eyebrow,#bss .bss-trust{display:none}
  #bss .bss-intro h1{margin-bottom:6px;font-size:clamp(1.5rem,6.6vw,1.9rem)}
  #bss .bss-sub{font-size:14px}
  #bss .bss-cal{padding:0}
  #bss .bss-loader{top:90px}
}
@media (prefers-reduced-motion:reduce){
  #bss .bss-bg span,#bss .bss-intro > *,#bss .bss-cal{animation:none}
  #bss .bss-hl::after{animation:none;transform:none}
}
</style>

<div id="bss">
  <div class="bss-top">
    <div class="bss-bg" aria-hidden="true"><span></span><span></span></div>

    <header class="bss-header">
      <img src="https://img1.wsimg.com/isteam/ip/ede29c46-864b-4bea-afe1-1c4cf4c2ccdf/logo/f2dc896d-bda5-4912-80f0-ba4c31a88c16.jpg/:/rs=w:285,h:86,cg:true,m/cr=w:285,h:86/qt=q:100/ll" alt="BrightSkies Services" width="285" height="86">
    </header>

    <div class="bss-intro">
      <p class="bss-eyebrow">BrightSkies Services</p>
      <h1>Schedule Your Financial Wellness <span class="bss-hl">Consultation</span></h1>
      <p class="bss-sub">Select an available time in the calendar below.</p>
      <ul class="bss-trust">
        <li><span class="bss-trust__g"><svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg></span><span class="bss-trust__stars" aria-hidden="true">★★★★★</span>Five-star Google reviews</li>
        <li><span class="bss-trust__check"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17 19 7.5"/></svg></span>Certified Profit First Professional</li>
        <li><span class="bss-trust__check"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17 19 7.5"/></svg></span>Monthly check-in calls</li>
      </ul>
    </div>
  </div>

  <div class="bss-cal">
    <p class="bss-loader" role="status">Loading available times…</p>

    <!-- =====================================================================
         YOUR CALENDAR GOES HERE

         Your Calendly calendar is already in place below. To use a different calendar:

         Option 1 (best): replace everything between the two PASTE lines below
         with your calendar's full embed code.
           - GHL calendar: open the calendar's share options and copy its embed code.
           - Calendly: Share, then Add to website, then Inline embed, and copy the code.

         Option 2 (you only have a link): replace everything between the two PASTE
         lines with this line, and put your link in place of YOUR-CALENDAR-LINK:
           <iframe src="YOUR-CALENDAR-LINK" title="Book your call" style="display:block;width:100%;height:800px;border:none;"></iframe>
         ===================================================================== -->
    <div class="bss-slot">
      <!-- ▼▼▼ PASTE YOUR CALENDAR EMBED CODE BELOW THIS LINE ▼▼▼ -->
      <div class="calendly-inline-widget" data-url="https://calendly.com/mturner-6/brightskies-strategy-session?primary_color=333394" data-resize="true" style="min-width:320px;height:700px;"></div>
      <script>
        /* Phones: skip Calendly's event-details block so the dates show right away, and keep the
           calendar to the screen's height (it scrolls inside) instead of making the page long. */
        (function () {
          var w = document.querySelector("#bss .calendly-inline-widget");
          if (!w || !window.matchMedia("(max-width: 640px)").matches) return;
          w.setAttribute("data-url", w.getAttribute("data-url") + "&hide_event_type_details=1");
          w.removeAttribute("data-resize");
        })();
      </script>
      <script type="text/javascript" src="https://assets.calendly.com/assets/external/widget.js" async></script>
      <!-- ▲▲▲ PASTE YOUR CALENDAR EMBED CODE ABOVE THIS LINE ▲▲▲ -->
    </div>

</div>

<script>
(function () {
  /* Path of funnel step 3. Calendly can't send people to your own thank-you page on its own,
     so this goes there once Calendly says the booking is done. GHL calendars ignore it
     (set their redirect in the calendar's settings). Set it to "" to turn it off. */
  var CONFIRMATION_URL = "/confirmation";

  if (window.__bssBooking) return;
  window.__bssBooking = true;

  var root = document.getElementById("bss");
  var slot = root && root.querySelector(".bss-slot");
  var loader = root && root.querySelector(".bss-loader");
  if (!slot || !loader) return;

  // Hide the "Loading available times" note once the calendar shows up.
  function done() { loader.classList.add("is-done"); }
  if (!slot.querySelector("*")) done();
  function watch(frame) { frame.addEventListener("load", function () { setTimeout(done, 400); }); }
  var frames = slot.querySelectorAll("iframe");
  for (var i = 0; i < frames.length; i++) watch(frames[i]);
  if ("MutationObserver" in window) {
    new MutationObserver(function (muts) {
      for (var m = 0; m < muts.length; m++) {
        for (var n = 0; n < muts[m].addedNodes.length; n++) {
          var node = muts[m].addedNodes[n];
          if (node.tagName === "IFRAME") watch(node);
          else if (node.querySelectorAll) { var inner = node.querySelectorAll("iframe"); for (var k = 0; k < inner.length; k++) watch(inner[k]); }
        }
      }
    }).observe(slot, { childList: true, subtree: true });
  }
  setTimeout(done, 10000);

  // Phones: the calendar fills exactly the rest of the screen, so the page itself doesn't scroll.
  var phone = window.matchMedia("(max-width: 640px)");
  function fitPhone() {
    var widget = slot.querySelector(".calendly-inline-widget");
    if (!widget || !phone.matches) return;
    var top = 0;
    for (var el = widget; el; el = el.offsetParent) top += el.offsetTop; // layout position, ignores the entrance animation
    widget.style.height = Math.max(460, Math.floor(window.innerHeight - top)) + "px";
  }
  fitPhone();
  // Re-fit once fonts, the logo and the rest of the page have loaded, in case the header changed height.
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitPhone);
  var logo = root.querySelector(".bss-header img");
  if (logo && !logo.complete) logo.addEventListener("load", fitPhone);
  if (document.readyState !== "complete") window.addEventListener("load", fitPhone);
  var lastWidth = window.innerWidth;
  window.addEventListener("resize", function () {
    // Ignore the small height changes from mobile browser toolbars sliding in and out.
    if (window.innerWidth === lastWidth && Math.abs(window.innerHeight - parseInt(slot.dataset.vh || 0, 10)) < 120) return;
    lastWidth = window.innerWidth;
    slot.dataset.vh = window.innerHeight;
    fitPhone();
  });
  slot.dataset.vh = window.innerHeight;

  window.addEventListener("message", function (e) {
    if (e.origin !== "https://calendly.com" || !e.data || typeof e.data.event !== "string" || e.data.event.indexOf("calendly.") !== 0) return;
    done();
    // Desktop: grow the calendar to fit Calendly's content, so there's no scrollbar inside it.
    if (e.data.event === "calendly.page_height" && e.data.payload && !phone.matches) {
      var h = parseInt(e.data.payload.height, 10), widget = slot.querySelector(".calendly-inline-widget");
      if (widget && h > 300) widget.style.height = h + "px";
    }
    if (e.data.event === "calendly.event_scheduled" && CONFIRMATION_URL) window.location.href = CONFIRMATION_URL;
  });
})();
</script>
