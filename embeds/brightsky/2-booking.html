<script>
/* Calendly only: Calendly can't send people to your own thank-you page on its own,
   so this goes to step 3 once Calendly says the booking is done. GHL calendars ignore it
   (set their redirect in the calendar's settings). Set CONFIRMATION_URL to "" to turn it off. */
(function () {
  var CONFIRMATION_URL = "/confirmation";
  if (!CONFIRMATION_URL || window.__bssCalendlyRedirect) return;
  window.__bssCalendlyRedirect = true;
  window.addEventListener("message", function (e) {
    if (e.origin === "https://calendly.com" && e.data && e.data.event === "calendly.event_scheduled") {
      window.location.href = CONFIRMATION_URL;
    }
  });
})();
</script>
